<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단순 위치 정보 확인 서비스</title>
    <style>
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .device-selection {
            margin-bottom: 2rem;
        }
        .check-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 1.5rem 2rem;
            font-size: 1.25rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 2rem;
            transition: background-color 0.2s;
        }
        .check-btn:hover {
            background-color: #0056b3;
        }
        .result-area {
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 1rem;
        }
        .result-item {
            margin: 0.5rem 0;
            font-size: 1.1rem;
        }
        .label {
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 단계 1: 기기 선택 UI (라디오 버튼) -->
    <div class="device-selection">
        <label>
            <input type="radio" name="device" value="computer" checked> 컴퓨터 위치
        </label>
        <label style="margin-left: 20px;">
            <input type="radio" name="device" value="mobile"> 휴대폰 위치
        </label>
    </div>

    <!-- 단계 2: 위치 확인 버튼 -->
    <button class="check-btn" onclick="requestLocation()">현재 위치 확인할까요?</button>

    <!-- 단계 3: 결과 표시 영역 -->
    <div class="result-area">
        <div class="result-item">
            <span class="label">도로명 주소:</span>
            <span id="address">-</span>
        </div>
        <div class="result-item">
            <span class="label">우편번호:</span>
            <span id="zipcode">-</span>
        </div>
    </div>
</div>

<script>
    // Google Maps API 키 (사용자가 실제 키를 입력해야 함)
    const GOOGLE_MAPS_API_KEY = 'YOUR_API_KEY_HERE';

    // 단계 4: 위치 정보 수집 및 API 호출 로직
    async function requestLocation() {
        // 1. 보안을 위한 권한 동의 확인
        if (!confirm("위치 정보를 수집하는 데 동의하십니까? (위치정보법 준수)")) {
            alert("위치 정보 수집 동의가 필요합니다.");
            return;
        }

        if (!navigator.geolocation) {
            alert("이 브라우저는 위치 정보를 지원하지 않습니다.");
            return;
        }

        // 2. Geolocation API를 통한 좌표 획득
        navigator.geolocation.getCurrentPosition(
            async (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                // 3. Reverse Geocoding API 호출
                await fetchAddress(lat, lng);
            },
            (error) => {
                console.error("위치 획득 실패:", error);
                alert("위치 정보를 가져오는 데 실패했습니다.");
            }
        );
    }

    // 단계 5: 구글 Reverse Geocoding API를 통한 주소 변환
    async function fetchAddress(lat, lng) {
        const url = `https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=${GOOGLE_MAPS_API_KEY}&language=ko`;

        try {
            const response = await fetch(url);
            const data = await response.json();

            if (data.status === "OK") {
                const results = data.results;
                let roadAddress = "찾을 수 없음";
                let zipCode = "찾을 수 없음";

                // 결과 배열에서 주소와 우편번호 추출
                if (results.length > 0) {
                    roadAddress = results[0].formatted_address;

                    // 우편번호(postal_code) 찾기
                    const addressComponents = results[0].address_components;
                    for (const component of addressComponents) {
                        if (component.types.includes("postal_code")) {
                            zipCode = component.long_name;
                            break;
                        }
                    }
                }

                // 4. 화면에 결과 표시
                document.getElementById('address').innerText = roadAddress;
                document.getElementById('zipcode').innerText = zipCode;
            } else {
                alert("주소 변환에 실패했습니다: " + data.status);
            }
        } catch (error) {
            console.error("API 호출 에러:", error);
            alert("주소 변환 서비스에 연결할 수 없습니다.");
        }
    }
</script>

</body>
</html>
