<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현재 위치 정보 확인</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }
        .device-selection {
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
        }
        .btn-confirm {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.25rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            margin-bottom: 2rem;
        }
        .btn-confirm:hover {
            background-color: #0056b3;
        }
        .result-container {
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 1rem;
            min-height: 80px;
        }
        .result-item {
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        #see-more-btn {
            margin-top: 2rem;
            background: none;
            border: none;
            color: #666;
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.9rem;
        }
        #more-info {
            display: none;
            margin-top: 1rem;
            text-align: left;
            font-size: 0.85rem;
            color: #555;
            background-color: #fafafa;
            padding: 1rem;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>위치 정보 서비스</h1>

        <div class="device-selection">
            <label>
                <input type="radio" name="device" value="Computer" checked> 컴퓨터 위치
            </label>
            <label>
                <input type="radio" name="device" value="Mobile"> 휴대폰 위치
            </label>
        </div>

        <button id="get-location" class="btn-confirm">현재 위치 확인할까요?</button>

        <div class="result-container" id="result-area">
            <div class="result-item" id="address-result">도로명 주소: </div>
            <div class="result-item" id="zipcode-result">우편번호: </div>
        </div>

        <button id="see-more-btn">더 보기</button>
        <div id="more-info">
            <h3>도로명 주소란?</h3>
            <p>도로명주소는 도로에는 이름을 부여하고 건물에는 번호를 부여하여 도로명과 건물번호로 표기하는 주소 체계입니다. 2014년부터 본격 시행되었습니다.</p>
            <h3>긴급 신고 안내</h3>
            <ul>
                <li>화재·구조·구급: 119</li>
                <li>범죄신고: 112</li>
                <li>정부 민원 안내: 110</li>
            </ul>
            <h3>주변 편의 시설</h3>
            <p>현재 위치 주변의 맛집이나 편의시설을 확인하시려면 아래 버튼을 클릭해 주세요.</p>
            <button onclick="window.open('https://www.google.com/maps/search/맛집/', '_blank')" style="cursor:pointer; padding: 5px 10px;">주변 맛집 검색</button>
        </div>
    </div>

    <!-- Google Maps API placeholder -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&language=ko"></script>
    <script>
        /**
         * 1단계: DOM 요소 참조 가져오기
         * 사용자 상호작용 및 결과 표시를 위해 HTML 요소를 선택합니다.
         */
        const getLocationBtn = document.getElementById('get-location');
        const addressResult = document.getElementById('address-result');
        const zipcodeResult = document.getElementById('zipcode-result');
        const seeMoreBtn = document.getElementById('see-more-btn');
        const moreInfo = document.getElementById('more-info');

        /**
         * 2단계: '더 보기' 토글 기능
         * AdSense 정책 및 추가 정보를 위해 숨겨진 내용을 보여줍니다.
         */
        seeMoreBtn.addEventListener('click', () => {
            const isHidden = moreInfo.style.display === 'none' || moreInfo.style.display === '';
            moreInfo.style.display = isHidden ? 'block' : 'none';
        });

        /**
         * 3단계: 현재 위치 확인 메인 로직
         */
        getLocationBtn.addEventListener('click', () => {
            // 위치 정보 수집 전 명시적 동의 확인 (위치정보법 준수)
            if (confirm("정확한 주소 확인을 위해 위치 정보 접근 권한이 필요합니다. 동의하시겠습니까?")) {
                getCurrentLocation();
            }
        });

        function getCurrentLocation() {
            addressResult.innerText = "도로명 주소: 위치를 찾는 중...";
            zipcodeResult.innerText = "우편번호: 확인 중...";

            // 브라우저의 Geolocation API 지원 여부 확인
            if (!navigator.geolocation) {
                alert("이 브라우저는 위치 정보를 지원하지 않습니다.");
                return;
            }

            // 4단계: 위도, 경도 좌표 수집
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    reverseGeocode(lat, lng);
                },
                (error) => {
                    console.error("위치 획득 실패:", error);
                    alert("위치 정보를 가져오는 데 실패했습니다. 설정에서 권한을 확인해 주세요.");
                },
                { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
            );
        }

        /**
         * 5단계: Google Maps Reverse Geocoding API를 통한 주소 변환
         */
        function reverseGeocode(lat, lng) {
            const geocoder = new google.maps.Geocoder();
            const latlng = { lat: parseFloat(lat), lng: parseFloat(lng) };

            // 선택된 기기 정보 가져오기
            const deviceType = document.querySelector('input[name="device"]:checked').value;
            const prefix = deviceType === "Computer" ? "[Computer]" : "[Mobile]";

            geocoder.geocode({ location: latlng }, (results, status) => {
                if (status === "OK") {
                    if (results[0]) {
                        // 결과 분석: 도로명 주소 및 우편번호 추출
                        let address = results[0].formatted_address;
                        let zip = "";

                        // 주소 구성 요소에서 우편번호(postal_code) 찾기
                        for (let component of results[0].address_components) {
                            if (component.types.includes("postal_code")) {
                                zip = component.long_name;
                                break;
                            }
                        }

                        // 6단계: 화면에 결과 표시 (기기 접두사 포함)
                        addressResult.innerText = `도로명 주소: ${prefix} ${address}`;
                        zipcodeResult.innerText = `우편번호: ${zip || "정보 없음"}`;
                    } else {
                        alert("주소 결과가 없습니다.");
                    }
                } else {
                    console.error("Geocoder 실패:", status);
                    alert("주소 변환에 실패했습니다: " + status);
                }
            });
        }
    </script>
</body>
</html>
