<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현재 위치 확인 서비스</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .device-selection {
            margin-bottom: 2rem;
        }
        .main-button {
            padding: 1.5rem 3rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .main-button:hover {
            background-color: #0056b3;
        }
        .result-area {
            margin-top: 2rem;
            text-align: left;
            font-size: 1.1rem;
        }
        .result-item {
            margin: 0.5rem 0;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1단계: 기기 선택 UI 구성 -->
    <div class="device-selection">
        <label>
            <input type="radio" name="device" value="컴퓨터" checked> 컴퓨터 위치
        </label>
        <label style="margin-left: 1rem;">
            <input type="radio" name="device" value="휴대폰"> 휴대폰 위치
        </label>
    </div>

    <!-- 2단계: 핵심 액션 버튼 -->
    <button class="main-button" onclick="requestLocationPermission()">현재 위치 확인할까요?</button>

    <!-- 3단계: 결과 표시 영역 -->
    <div class="result-area" id="result-area">
        <div class="result-item" id="address-result">도로명 주소: </div>
        <div class="result-item" id="postcode-result">우편번호: </div>
    </div>
</div>

<!-- Google Maps API 로드 (Reverse Geocoding을 위해 필요) -->
<script>
    // Playwright 검증 시 Mocking이 우선되도록 체크
    if (!window.google || !window.google.maps || !window.google.maps.Geocoder) {
        const script = document.createElement('script');
        script.src = "https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&language=ko";
        document.head.appendChild(script);
    }
</script>

<script>
    /**
     * 4단계: 위치 정보 접근 권한 동의 확인 및 좌표 수집
     * 위치정보법 준수를 위해 명시적으로 확인창을 띄웁니다.
     */
    function requestLocationPermission() {
        if (confirm("정확한 주소 변환을 위해 현재 위치 정보에 접근하시겠습니까?")) {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(successLocation, errorLocation, {
                    enableHighAccuracy: true,
                    timeout: 5000,
                    maximumAge: 0
                });
            } else {
                alert("이 브라우저에서는 위치 정보 기능을 사용할 수 없습니다.");
            }
        }
    }

    /**
     * 5단계: 좌표 수집 성공 시 호출되는 콜백
     */
    function successLocation(position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;

        // 선택된 기기 값 가져오기
        const selectedDevice = document.querySelector('input[name="device"]:checked').value;

        // 역지오코딩 수행
        reverseGeocode(lat, lng, selectedDevice);
    }

    /**
     * 6단계: Google Maps Geocoder를 이용한 주소 변환 (Reverse Geocoding)
     * CORS 이슈를 피하기 위해 SDK의 Geocoder 객체를 사용합니다.
     */
    function reverseGeocode(lat, lng, device) {
        const geocoder = new google.maps.Geocoder();
        const latlng = { lat: parseFloat(lat), lng: parseFloat(lng) };

        geocoder.geocode({ location: latlng }, (results, status) => {
            if (status === "OK") {
                if (results[0]) {
                    // 결과에서 주소와 우편번호 추출
                    const fullAddress = results[0].formatted_address;
                    let postCode = "";

                    // 우편번호 찾기
                    for (let component of results[0].address_components) {
                        if (component.types.includes("postal_code")) {
                            postCode = component.long_name;
                            break;
                        }
                    }

                    // 7단계: 화면에 결과 출력
                    document.getElementById("address-result").innerText = `도로명 주소: [${device}] ${fullAddress}`;
                    document.getElementById("postcode-result").innerText = `우편번호: ${postCode}`;
                } else {
                    alert("결과를 찾을 수 없습니다.");
                }
            } else {
                alert("Geocoder 실패: " + status);
            }
        });
    }

    function errorLocation() {
        alert("위치 정보를 가져오는 데 실패했습니다.");
    }
</script>

</body>
</html>
