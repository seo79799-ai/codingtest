<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단순 위치 정보 확인 서비스</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .device-selection {
            margin-bottom: 2rem;
        }
        .main-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 2rem;
            width: 100%;
        }
        .main-button:hover {
            background-color: #45a049;
        }
        .result-area {
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 1rem;
        }
        .result-item {
            margin: 0.5rem 0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1단계: 기기 선택 (라디오 버튼) -->
        <div class="device-selection">
            <label>
                <input type="radio" name="device" value="[컴퓨터]" checked> 컴퓨터 위치
            </label>
            <label style="margin-left: 1rem;">
                <input type="radio" name="device" value="[휴대폰]"> 휴대폰 위치
            </label>
        </div>

        <!-- 2단계: 확인 버튼 -->
        <button class="main-button" onclick="checkLocation()">현재 위치 확인할까요?</button>

        <!-- 3단계: 결과 표시 -->
        <div class="result-area">
            <div class="result-item" id="roadAddress">도로명 주소: </div>
            <div class="result-item" id="zipCode">우편번호: </div>
        </div>
    </div>

    <!-- Google Maps API (YOUR_GOOGLE_MAPS_API_KEY를 실제 키로 교체해야 합니다) -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&language=ko"></script>

    <script>
        function checkLocation() {
            // 위치 정보법 준수를 위한 동의 요청 (브라우저 기본 팝업 활용)
            if (!confirm("위치 정보를 수집하기 위해 위치 권한이 필요합니다. 동의하시겠습니까?")) {
                alert("위치 정보 수집에 동의하지 않으셨습니다.");
                return;
            }

            if (!navigator.geolocation) {
                alert("이 브라우저는 위치 정보를 지원하지 않습니다.");
                return;
            }

            // 기기 선택 값 가져오기
            const devicePrefix = document.querySelector('input[name="device"]:checked').value;

            // 로딩 상태 표시
            document.getElementById('roadAddress').innerText = "도로명 주소: 위치 정보를 찾는 중...";
            document.getElementById('zipCode').innerText = "우편번호: 확인 중...";

            // 브라우저 Geolocation API 사용
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    reverseGeocode(lat, lng, devicePrefix);
                },
                (error) => {
                    alert("위치 정보를 가져오는 데 실패했습니다: " + error.message);
                    document.getElementById('roadAddress').innerText = "도로명 주소: 오류 발생";
                },
                { enableHighAccuracy: true }
            );
        }

        function reverseGeocode(lat, lng, prefix) {
            const geocoder = new google.maps.Geocoder();
            const latlng = { lat: parseFloat(lat), lng: parseFloat(lng) };

            geocoder.geocode({ location: latlng }, (results, status) => {
                if (status === "OK") {
                    if (results[0]) {
                        // 결과 가공 및 표시
                        let address = results[0].formatted_address;
                        // "대한민국 " 접두어가 있다면 제거 (선택 사항)
                        address = address.replace("대한민국 ", "");

                        let postalCode = "";
                        // 주소 구성 요소에서 우편번호 추출
                        for (const component of results[0].address_components) {
                            if (component.types.includes("postal_code")) {
                                postalCode = component.long_name;
                                break;
                            }
                        }

                        document.getElementById('roadAddress').innerText = `도로명 주소: ${prefix} ${address}`;
                        document.getElementById('zipCode').innerText = `우편번호: ${postalCode}`;
                    } else {
                        alert("주소 결과를 찾을 수 없습니다.");
                    }
                } else {
                    alert("Geocode 실패: " + status);
                }
            });
        }
    </script>
</body>
</html>
