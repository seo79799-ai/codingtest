<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단순 위치 확인 서비스</title>
    <style>
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        .device-selection {
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .device-selection label {
            cursor: pointer;
            margin: 0 10px;
        }
        .main-button {
            padding: 20px 40px;
            font-size: 1.4rem;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,123,255,0.3);
        }
        .main-button:active {
            transform: scale(0.98);
            box-shadow: 0 2px 5px rgba(0,123,255,0.2);
        }
        .result-area {
            margin-top: 35px;
            text-align: left;
        }
        .result-item {
            margin: 12px 0;
            padding: 15px;
            background: #f8f9fa;
            border-left: 5px solid #007bff;
            border-radius: 8px;
            font-size: 1rem;
            line-height: 1.5;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 기기 선택 영역: 상단에 라디오 버튼 배치 -->
    <div class="device-selection">
        <label>
            <input type="radio" name="device" value="컴퓨터" checked> 컴퓨터 위치
        </label>
        <label>
            <input type="radio" name="device" value="휴대폰"> 휴대폰 위치
        </label>
    </div>

    <!-- 2. 확인 버튼: 화면 중앙에 크고 명확하게 배치 -->
    <button id="getLocationBtn" class="main-button">현재 위치 확인할까요?</button>

    <!-- 3. 결과 표시 영역: 버튼 클릭 후 정보 업데이트 -->
    <div class="result-area">
        <div id="addressResult" class="result-item">도로명 주소: <span class="loading">확인 전</span></div>
        <div id="zipResult" class="result-item">우편번호: <span class="loading">확인 전</span></div>
    </div>
</div>

<!-- Google Maps JavaScript API (Reverse Geocoding 기능을 위해 필요) -->
<script>
    // 테스트 환경에서 mock 객체가 이미 정의되어 있을 수 있으므로 체크 후 로드
    if (typeof google === 'undefined') {
        const script = document.createElement('script');
        // 'YOUR_GOOGLE_MAPS_API_KEY'는 실제 키로 교체되어야 합니다.
        // language=ko를 통해 한국어 주소 응답을 강제합니다.
        script.src = "https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&language=ko";
        script.async = true;
        document.head.appendChild(script);
    }
</script>
<!-- 메인 로직 파일 -->
<script src="script.js"></script>
</body>
</html>
