<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단순 위치 정보 확인 서비스</title>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }
        .device-selector {
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .main-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 1.5rem 2rem;
            font-size: 1.25rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            width: 100%;
            margin-bottom: 2rem;
        }
        .main-button:active {
            transform: scale(0.98);
            background-color: #0056b3;
        }
        .result-area {
            text-align: left;
            background: #f1f3f5;
            padding: 1rem;
            border-radius: 8px;
            min-height: 100px;
        }
        .result-item {
            margin: 10px 0;
            font-size: 1rem;
            line-height: 1.5;
        }
        .info-section {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #6c757d;
            text-align: left;
            border-top: 1px solid #dee2e6;
            padding-top: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1단계: 기기 선택 라디오 버튼 -->
    <div class="device-selector">
        <label>
            <input type="radio" name="device" value="컴퓨터" checked> 컴퓨터 위치
        </label>
        <label>
            <input type="radio" name="device" value="휴대폰"> 휴대폰 위치
        </label>
    </div>

    <!-- 2단계: 중앙 확인 버튼 -->
    <button class="main-button" onclick="checkLocation()">현재 위치 확인할까요?</button>

    <!-- 3단계: 결과 표시 영역 -->
    <div class="result-area" id="resultArea">
        <div class="result-item" id="addressResult">도로명 주소: 대기 중...</div>
        <div class="result-item" id="postcodeResult">우편번호: 대기 중...</div>
    </div>

    <!-- 4단계: 추가 정보 (AdSense 및 정보 제공용) -->
    <div class="info-section">
        <strong>💡 알고 계셨나요?</strong>
        <p>우리나라의 도로명 주소는 도로에 이름을 붙이고 건물에 번호를 붙여 체계적으로 관리됩니다. 위급 상황 시 119나 112에 현재 위치를 정확히 알리는 데 매우 중요합니다.</p>
    </div>
</div>

<!-- Google Maps JavaScript API 로드 -->
<script>
    // 테스트 환경을 고려하여 google 객체가 없을 때만 스크립트 로드
    if (!window.google) {
        const script = document.createElement('script');
        script.src = `https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&language=ko`;
        document.head.appendChild(script);
    }
</script>

<script>
    /**
     * 위치 정보를 확인하고 주소로 변환하는 메인 함수
     */
    function checkLocation() {
        // 5단계: 위치 정보 접근 권한 확인 (위치정보법 준수)
        if (!confirm("정확한 주소 변환을 위해 현재 위치 정보에 접근하시겠습니까?")) {
            alert("위치 정보 접근을 거부하셨습니다.");
            return;
        }

        const addressEl = document.getElementById('addressResult');
        const postcodeEl = document.getElementById('postcodeResult');
        const deviceType = document.querySelector('input[name="device"]:checked').value;

        addressEl.innerText = "위치 수집 중...";
        postcodeEl.innerText = "";

        // 6단계: 브라우저 Geolocation API 사용
        if (!navigator.geolocation) {
            alert("이 브라우저는 위치 정보를 지원하지 않습니다.");
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                reverseGeocode(lat, lng, deviceType);
            },
            (error) => {
                console.error(error);
                addressEl.innerText = "위치를 가져오지 못했습니다.";
            },
            { enableHighAccuracy: true }
        );
    }

    /**
     * 구글 Reverse Geocoding API를 사용하여 좌표를 주소로 변환
     */
    function reverseGeocode(lat, lng, deviceType) {
        const geocoder = new google.maps.Geocoder();
        const latlng = { lat: parseFloat(lat), lng: parseFloat(lng) };

        geocoder.geocode({ location: latlng }, (results, status) => {
            const addressEl = document.getElementById('addressResult');
            const postcodeEl = document.getElementById('postcodeResult');

            if (status === "OK") {
                if (results[0]) {
                    // 7단계: 결과 파싱 및 표시
                    let address = results[0].formatted_address;
                    let postcode = "";

                    // 우편번호 추출
                    for (let component of results[0].address_components) {
                        if (component.types.includes("postal_code")) {
                            postcode = component.long_name;
                            break;
                        }
                    }

                    addressEl.innerText = `도로명 주소: [${deviceType} 위치] ${address}`;
                    postcodeEl.innerText = `우편번호: ${postcode}`;
                } else {
                    addressEl.innerText = "결과를 찾을 수 없습니다.";
                }
            } else {
                addressEl.innerText = "주소 변환 실패: " + status;
            }
        });
    }
</script>

</body>
</html>
