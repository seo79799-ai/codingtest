<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위치 정보 확인 서비스</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }
        .device-selection {
            margin-bottom: 2rem;
        }
        .check-button {
            padding: 1rem 2rem;
            font-size: 1.5rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .check-button:hover {
            background-color: #0056b3;
        }
        .result-area {
            margin-top: 2rem;
            font-size: 1.1rem;
            text-align: left;
            word-break: keep-all;
        }
        .result-item {
            margin-bottom: 0.8rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1단계: 기기 선택 (컴퓨터 또는 휴대폰) -->
        <div class="device-selection">
            <input type="radio" id="computer" name="device" value="Computer" checked>
            <label for="computer">컴퓨터 위치</label>
            <input type="radio" id="mobile" name="device" value="Mobile">
            <label for="mobile">휴대폰 위치</label>
        </div>

        <!-- 2단계: 위치 확인 시작 버튼 -->
        <button id="checkLocation" class="check-button">현재 위치 확인할까요?</button>

        <!-- 3단계: 결과 표시 영역 -->
        <div class="result-area">
            <div id="addressResult" class="result-item">도로명 주소: </div>
            <div id="zipcodeResult" class="result-item">우편번호: </div>
        </div>
    </div>

    <script>
        const API_KEY = 'YOUR_GOOGLE_MAPS_API_KEY'; // 구글 맵스 API 키를 입력하세요.

        document.getElementById('checkLocation').addEventListener('click', () => {
            // 4단계: 위치 정보 접근 권한 요청 및 수집
            if (!navigator.geolocation) {
                alert("이 브라우저는 위치 정보를 지원하지 않습니다.");
                return;
            }

            // 위치 정보 접근 권한 동의 팝업은 브라우저 기본 기능을 통해 구현됨
            navigator.geolocation.getCurrentPosition(success, error);
        });

        async function success(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const deviceType = document.querySelector('input[name="device"]:checked').value;
            const prefix = `[${deviceType}] `;

            try {
                // 5단계: Google Maps Reverse Geocoding API 호출
                // 한국어(ko) 결과를 요청하기 위해 language=ko 파라미터 추가
                const response = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=${API_KEY}&language=ko`);
                const data = await response.json();

                if (data.status === 'OK') {
                    let address = "주소를 찾을 수 없습니다.";
                    let zipcode = "우편번호를 찾을 수 없습니다.";

                    // 결과 중 도로명 주소(street_address) 또는 첫 번째 결과 탐색
                    const result = data.results.find(r => r.types.includes('street_address')) || data.results[0];

                    if (result) {
                        address = result.formatted_address;

                        // 우편번호(postal_code) 추출
                        const postCodeComponent = result.address_components.find(c => c.types.includes('postal_code'));
                        if (postCodeComponent) {
                            zipcode = postCodeComponent.long_name;
                        }
                    }

                    // 6단계: 결과 화면에 표시
                    document.getElementById('addressResult').innerText = `도로명 주소: ${prefix}${address}`;
                    document.getElementById('zipcodeResult').innerText = `우편번호: ${prefix}${zipcode}`;
                } else {
                    alert("주소 변환에 실패했습니다: " + data.status);
                }
            } catch (err) {
                console.error(err);
                alert("오류가 발생했습니다.");
            }
        }

        function error() {
            alert("위치 정보를 가져올 수 없습니다. 권한을 허용해 주세요.");
        }
    </script>
</body>
</html>
