<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위치 정보 확인 서비스</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .device-selection {
            margin-bottom: 2rem;
        }
        .main-button {
            padding: 1.5rem 3rem;
            font-size: 1.5rem;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .main-button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 2rem;
            font-size: 1.2rem;
            color: #333;
        }
        .result p {
            margin: 0.5rem 0;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1단계: 기기 선택 라디오 버튼 -->
    <div class="device-selection">
        <label>
            <input type="radio" name="device" value="Computer" checked> 컴퓨터 위치
        </label>
        <label style="margin-left: 20px;">
            <input type="radio" name="device" value="Mobile"> 휴대폰 위치
        </label>
    </div>

    <!-- 2단계: 메인 확인 버튼 -->
    <button class="main-button" onclick="confirmAndGetLocation()">현재 위치 확인할까요?</button>

    <!-- 3단계: 결과 표시 영역 -->
    <div class="result" id="result-area">
        <p id="road-address">도로명 주소: </p>
        <p id="zip-code">우편번호: </p>
    </div>
</div>

<script>
    // Google Maps API Key 플레이스홀더
    const GOOGLE_MAPS_API_KEY = 'YOUR_GOOGLE_MAPS_API_KEY';

    /**
     * 위치 정보 수집 전 사용자 동의를 구하고 위치 정보를 가져오는 함수
     */
    function confirmAndGetLocation() {
        // 보안: 위치정보법 준수를 위한 사용자 동의 팝업
        const userAgreed = confirm("정확한 주소 변환을 위해 현재 위치 정보 접근 권한이 필요합니다. 동의하시겠습니까?");

        if (userAgreed) {
            getLocation();
        } else {
            alert("위치 정보 접근이 거부되었습니다.");
        }
    }

    /**
     * 브라우저의 Geolocation API를 사용하여 좌표를 수집하는 함수
     */
    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    reverseGeocode(lat, lng);
                },
                (error) => {
                    console.error("위치 획득 실패:", error);
                    alert("위치 정보를 가져오는 데 실패했습니다.");
                }
            );
        } else {
            alert("이 브라우저는 위치 정보를 지원하지 않습니다.");
        }
    }

    /**
     * Google Maps Reverse Geocoding API를 사용하여 좌표를 주소로 변환하는 함수
     */
    async function reverseGeocode(lat, lng) {
        const deviceType = document.querySelector('input[name="device"]:checked').value;
        const url = `https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=${GOOGLE_MAPS_API_KEY}&language=ko`;

        try {
            const response = await fetch(url);
            const data = await response.json();

            if (data.status === "OK") {
                // 첫 번째 결과에서 도로명 주소와 우편번호 추출
                const result = data.results[0];
                const address = result.formatted_address;
                let zipCode = "";

                // address_components에서 우편번호(postal_code) 찾기
                for (const component of result.address_components) {
                    if (component.types.includes("postal_code")) {
                        zipCode = component.long_name;
                        break;
                    }
                }

                // 결과 표시 (메모리에 따라 기기 접두사 추가)
                document.getElementById('road-address').innerText = `도로명 주소: [${deviceType}] ${address}`;
                document.getElementById('zip-code').innerText = `우편번호: ${zipCode}`;
            } else {
                console.error("Geocoding 실패:", data.status);
                alert("주소 변환에 실패했습니다. (API 키 확인 필요)");
            }
        } catch (error) {
            console.error("API 호출 오류:", error);
            alert("네트워크 오류가 발생했습니다.");
        }
    }
</script>

</body>
</html>
