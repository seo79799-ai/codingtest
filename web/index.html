<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단순 위치 정보 확인 서비스</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .radio-group {
            margin-bottom: 2rem;
        }
        .main-button {
            padding: 1.5rem 3rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .main-button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 2rem;
            font-size: 1.2rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1단계: 기기 선택 라디오 버튼 -->
        <div class="radio-group">
            <input type="radio" id="computer" name="device" value="컴퓨터" checked>
            <label for="computer">컴퓨터 위치</label>
            <input type="radio" id="mobile" name="device" value="휴대폰">
            <label for="mobile">휴대폰 위치</label>
        </div>

        <!-- 2단계: 메인 확인 버튼 -->
        <button class="main-button" id="checkLocationBtn">현재 위치 확인할까요?</button>

        <!-- 3단계: 결과 표시 영역 -->
        <div class="result" id="resultArea">
            <p id="address">도로명 주소: [대기 중]</p>
            <p id="zipcode">우편번호: [대기 중]</p>
        </div>
    </div>

    <!-- Google Maps API (Reverse Geocoding을 위해 필요) -->
    <!-- YOUR_GOOGLE_MAPS_API_KEY 부분을 실제 API 키로 교체해야 합니다. -->
    <script>
        (function() {
            if (!window.google) {
                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&language=ko`;
                script.async = true;
                script.defer = true;
                document.head.appendChild(script);
            }
        })();
    </script>

    <script>
        const checkBtn = document.getElementById('checkLocationBtn');
        const addressText = document.getElementById('address');
        const zipcodeText = document.getElementById('zipcode');

        checkBtn.addEventListener('click', () => {
            // 위치 정보 접근 권한 동의 확인 (브라우저 기본 팝업 활용)
            if (confirm("정확한 주소 확인을 위해 위치 정보 접근 권한이 필요합니다. 동의하시겠습니까?")) {
                getLocation();
            }
        });

        // 4단계: 브라우저 Geolocation API를 이용한 위치 수집
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        reverseGeocode(lat, lng);
                    },
                    (error) => {
                        alert("위치 정보를 가져오는 데 실패했습니다: " + error.message);
                    }
                );
            } else {
                alert("이 브라우저는 위치 정보를 지원하지 않습니다.");
            }
        }

        // 5단계: Google Maps Geocoder를 이용한 주소 변환 (Reverse Geocoding)
        function reverseGeocode(lat, lng) {
            if (typeof google === 'undefined' || typeof google.maps === 'undefined') {
                alert("Google Maps API가 아직 로드되지 않았습니다. 잠시 후 다시 시도해 주세요.");
                return;
            }
            const geocoder = new google.maps.Geocoder();
            const latlng = { lat: parseFloat(lat), lng: parseFloat(lng) };

            geocoder.geocode({ location: latlng }, (results, status) => {
                if (status === "OK") {
                    if (results[0]) {
                        // 기기 선택 값 가져오기
                        const device = document.querySelector('input[name="device"]:checked').value;
                        const prefix = `[${device} 위치] `;

                        // 도로명 주소 추출
                        const formattedAddress = results[0].formatted_address;

                        // 우편번호 추출
                        let postalCode = "정보 없음";
                        for (const component of results[0].address_components) {
                            if (component.types.includes("postal_code")) {
                                postalCode = component.long_name;
                                break;
                            }
                        }

                        // 결과 표시
                        addressText.innerText = `도로명 주소: ${prefix}${formattedAddress}`;
                        zipcodeText.innerText = `우편번호: ${postalCode}`;
                    } else {
                        alert("결과를 찾을 수 없습니다.");
                    }
                } else {
                    alert("Geocoder 실패: " + status);
                }
            });
        }
    </script>
</body>
</html>
