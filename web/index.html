<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단순 위치 정보 확인 서비스</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #f0f2f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 { font-size: 1.5rem; color: #1a73e8; }
        .device-selection { margin: 20px 0; }
        .main-button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
        }
        .main-button:hover { background-color: #1557b0; }
        .result-area {
            margin-top: 30px;
            text-align: left;
            border-top: 1px solid #ddd;
            padding-top: 20px;
            font-weight: bold;
        }
        .info-section {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #666;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📍 현재 위치 정보 확인</h1>

    <!-- 1단계: 기기 선택 (라디오 버튼) -->
    <div class="device-selection">
        <label>
            <input type="radio" name="device" value="Computer" checked> 컴퓨터 위치
        </label>
        <label style="margin-left: 15px;">
            <input type="radio" name="device" value="Mobile"> 휴대폰 위치
        </label>
    </div>

    <!-- 2단계: 확인 버튼 -->
    <button class="main-button" onclick="checkLocation()">현재 위치 확인할까요?</button>

    <!-- 3단계: 결과 표시 -->
    <div class="result-area" id="result">
        <p id="roadAddress">도로명 주소: [결과 대기 중]</p>
        <p id="zipCode">우편번호: [결과 대기 중]</p>
    </div>

    <!-- AdSense 준수 및 정보 제공을 위한 부가 섹션 -->
    <div class="info-section">
        <h3>💡 도로명 주소란?</h3>
        <p>도로명 주소는 도로에 이름을 붙이고 건물에 번호를 붙여 표기하는 주소 체계입니다. 2014년부터 전면 시행되었으며, 체계적인 위치 찾기가 가능합니다.</p>
        <h3>🚑 안전 및 생활 정보</h3>
        <p>비상시 인근 119 안전센터나 경찰서 위치를 파악할 때 유용하게 사용하실 수 있습니다.</p>
    </div>
</div>

<script>
    // Google Maps API Key (placeholder)
    const API_KEY = 'YOUR_GOOGLE_MAPS_API_KEY';

    async function checkLocation() {
        // 위치 정보 수집 전 권한 동의 확인 (위치정보법 준수)
        if (!confirm("정확한 주소 확인을 위해 위치 정보 접근 권한이 필요합니다. 동의하시겠습니까?")) {
            alert("위치 정보 접근을 거부하셨습니다.");
            return;
        }

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(success, error, {
                enableHighAccuracy: true,
                timeout: 5000,
                maximumAge: 0
            });
        } else {
            alert("이 브라우저에서는 위치 서비스를 지원하지 않습니다.");
        }
    }

    async function success(position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const deviceType = document.querySelector('input[name="device"]:checked').value;
        const prefix = deviceType === 'Computer' ? '[컴퓨터] ' : '[모바일] ';

        try {
            // Google Maps Reverse Geocoding API 호출
            const response = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=${API_KEY}&language=ko`);
            const data = await response.json();

            if (data.status === "OK") {
                const results = data.results;
                let address = "주소를 찾을 수 없습니다.";
                let zip = "우편번호 없음";

                // 한국 주소 결과 분석 (주로 첫 번째 결과가 가장 정확함)
                if (results.length > 0) {
                    address = results[0].formatted_address;

                    // 우편번호(postal_code) 찾기
                    const postCodeObj = results[0].address_components.find(comp => comp.types.includes("postal_code"));
                    if (postCodeObj) {
                        zip = postCodeObj.long_name;
                    }
                }

                document.getElementById('roadAddress').innerText = `도로명 주소: ${prefix}${address}`;
                document.getElementById('zipCode').innerText = `우편번호: ${zip}`;
            } else {
                console.error("Geocoding Error: ", data.status);
                alert("주소 변환 중 오류가 발생했습니다. (API 키 확인 필요)");
            }
        } catch (err) {
            console.error(err);
            alert("서버 통신 중 오류가 발생했습니다.");
        }
    }

    function error() {
        alert("위치 정보를 가져오는 데 실패했습니다. 설정에서 위치 권한을 확인해 주세요.");
    }
</script>

</body>
</html>
