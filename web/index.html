<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위치 정보 확인 서비스</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .device-selection {
            margin-bottom: 30px;
        }
        .check-button {
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .check-button:hover {
            background-color: #0056b3;
        }
        .result-container {
            margin-top: 30px;
            font-size: 18px;
            text-align: left;
            display: inline-block;
        }
        .result-item {
            margin: 10px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 단계 1: 기기 선택 UI 구성 (라디오 버튼) -->
    <div class="device-selection">
        <label>
            <input type="radio" name="device" value="Computer" checked> 컴퓨터 위치
        </label>
        <label style="margin-left: 20px;">
            <input type="radio" name="device" value="Mobile"> 휴대폰 위치
        </label>
    </div>

    <!-- 단계 2: 확인 버튼 배치 -->
    <button class="check-button" onclick="askPermission()">현재 위치 확인할까요?</button>

    <!-- 단계 3: 결과 표시 영역 -->
    <div id="result" class="result-container" style="display: none;">
        <div class="result-item" id="address">도로명 주소: </div>
        <div class="result-item" id="zipcode">우편번호: </div>
    </div>
</div>

<script>
    // 단계 4: 위치 정보 수집 전 권한 동의 요청
    function askPermission() {
        if (!navigator.geolocation) {
            alert("이 브라우저는 위치 정보를 지원하지 않습니다.");
            return;
        }

        // 브라우저 기본 팝업을 통해 위치 정보 접근 권한 동의를 구함 (위치정보법 준수)
        navigator.geolocation.getCurrentPosition(success, error, {
            enableHighAccuracy: true
        });
    }

    // 단계 5: 좌표 수집 성공 시 처리
    async function success(position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;

        // 선택된 기기 값 가져오기
        const deviceType = document.querySelector('input[name="device"]:checked').value;
        const prefix = `[${deviceType}] `;

        // 단계 6: Google Maps Reverse Geocoding API 호출
        // 주의: 'YOUR_GOOGLE_MAPS_API_KEY'를 실제 API 키로 교체해야 작동합니다.
        const apiKey = 'YOUR_GOOGLE_MAPS_API_KEY';
        const url = `https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=${apiKey}&language=ko`;

        try {
            const response = await fetch(url);
            const data = await response.json();

            if (data.status === "OK") {
                let address = "주소를 찾을 수 없습니다.";
                let zipcode = "없음";

                // 결과 배열에서 적절한 도로명 주소와 우편번호 추출
                if (data.results.length > 0) {
                    address = data.results[0].formatted_address;

                    // 우편번호(postal_code) 찾기
                    const postCodeObj = data.results[0].address_components.find(component =>
                        component.types.includes("postal_code")
                    );
                    if (postCodeObj) {
                        zipcode = postCodeObj.long_name;
                    }
                }

                // 단계 7: 결과 표시
                document.getElementById('address').innerText = `도로명 주소: ${prefix}${address}`;
                document.getElementById('zipcode').innerText = `우편번호: ${zipcode}`;
                document.getElementById('result').style.display = 'block';
            } else {
                alert("주소 변환에 실패했습니다: " + data.status);
            }
        } catch (err) {
            console.error(err);
            alert("API 호출 중 오류가 발생했습니다.");
        }
    }

    // 단계 8: 위치 정보 수집 실패 시 처리
    function error() {
        alert("위치 정보를 가져올 수 없습니다. 권한 승인이 필요합니다.");
    }
</script>

</body>
</html>
