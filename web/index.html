<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현재 위치 확인 서비스</title>
    <style>
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }
        .device-selection {
            margin-bottom: 2rem;
        }
        .device-selection label {
            margin: 0 10px;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .action-area {
            margin-bottom: 2rem;
        }
        #checkLocationBtn {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        #checkLocationBtn:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }
        #checkLocationBtn:active {
            transform: scale(0.95);
        }
        .result-area {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
            text-align: left;
        }
        .result-area p {
            margin: 10px 0;
            font-size: 1rem;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>위치 정보 확인</h1>

        <!-- 기기 선택 영역 -->
        <div class="device-selection">
            <label>
                <input type="radio" name="device" value="computer" checked> 컴퓨터 위치
            </label>
            <label>
                <input type="radio" name="device" value="mobile"> 휴대폰 위치
            </label>
        </div>

        <!-- 확인 버튼 -->
        <div class="action-area">
            <button id="checkLocationBtn">현재 위치 확인할까요?</button>
        </div>

        <!-- 결과 표시 영역 -->
        <div id="result" class="result-area">
            <p id="roadAddress">도로명 주소: [결과 기다리는 중]</p>
            <p id="postalCode">우편번호: [결과 기다리는 중]</p>
        </div>
    </div>

    <!-- Google Maps API 로드 -->
    <script>
        // 테스트 환경(모킹)이 아닐 때만 실제 구글 맵 API를 로드합니다.
        if (!window.google || !window.google.maps) {
            const script = document.createElement('script');
            script.src = "https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&language=ko";
            document.head.appendChild(script);
        }
    </script>

    <script>
        /**
         * 3단계: Google Maps Reverse Geocoding 호출 및 결과 표시
         */
        function reverseGeocode(lat, lng, deviceName) {
            const geocoder = new google.maps.Geocoder();
            const latlng = { lat: parseFloat(lat), lng: parseFloat(lng) };

            geocoder.geocode({ location: latlng }, (results, status) => {
                if (status === "OK") {
                    if (results[0]) {
                        // 결과에서 도로명 주소 추출 (formatted_address)
                        const address = results[0].formatted_address;

                        // 결과에서 우편번호 추출 (address_components에서 postal_code 찾기)
                        let postCode = "우편번호 없음";
                        for (const component of results[0].address_components) {
                            if (component.types.includes("postal_code")) {
                                postCode = component.long_name;
                                break;
                            }
                        }

                        document.getElementById('roadAddress').innerText = `도로명 주소: ${deviceName} ${address}`;
                        document.getElementById('postalCode').innerText = `우편번호: ${postCode}`;
                    } else {
                        alert("결과를 찾을 수 없습니다.");
                        document.getElementById('roadAddress').innerText = "도로명 주소: 찾을 수 없음";
                    }
                } else {
                    console.error("Geocoder 실패 원인: " + status);
                    alert("주소 변환에 실패했습니다: " + status);
                    document.getElementById('roadAddress').innerText = "도로명 주소: 변환 실패";
                }
            });
        }

        /**
         * 웹 버전 위치 확인 로직
         * 1단계: 사용자 동의 구하기 (위치정보법 준수)
         * 2단계: 브라우저 Geolocation API로 위도, 경도 수집
         * 3단계: (다음 단계에서 추가) Google Maps Reverse Geocoding 호출
         */
        document.getElementById('checkLocationBtn').addEventListener('click', () => {
            // 1단계: 위치 정보 접근 권한 동의 팝업
            const userConsent = confirm("사용자의 현재 위치 정보를 수집하여 도로명 주소를 확인하시겠습니까?");

            if (!userConsent) {
                alert("위치 정보 수집 동의가 거절되었습니다.");
                return;
            }

            // 결과 표시 영역 초기화
            document.getElementById('roadAddress').innerText = "도로명 주소: 위치 정보를 찾는 중...";
            document.getElementById('postalCode').innerText = "우편번호: 위치 정보를 찾는 중...";

            // 2단계: Geolocation API 호출
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        console.log(`수집된 좌표: 위도 ${lat}, 경도 ${lng}`);

                        // 기기 선택 값 가져오기
                        const deviceType = document.querySelector('input[name="device"]:checked').value;
                        const deviceName = deviceType === 'computer' ? '[컴퓨터 위치]' : '[휴대폰 위치]';

                        // 좌표를 주소로 변환하는 함수 호출 (다음 단계에서 구현)
                        if (typeof reverseGeocode === 'function') {
                            reverseGeocode(lat, lng, deviceName);
                        } else {
                            // 아직 API 연동 전이므로 좌표만 출력
                            document.getElementById('roadAddress').innerText = `도로명 주소: ${deviceName} (좌표 수집 완료: ${lat.toFixed(4)}, ${lng.toFixed(4)})`;
                            document.getElementById('postalCode').innerText = "우편번호: [API 연동 대기 중]";
                        }
                    },
                    (error) => {
                        console.error("위치 수집 실패:", error);
                        alert("위치 정보를 가져오는 데 실패했습니다. 위치 서비스 설정을 확인해 주세요.");
                        document.getElementById('roadAddress').innerText = "도로명 주소: 오류 발생";
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                alert("이 브라우저는 위치 정보를 지원하지 않습니다.");
            }
        });
    </script>
</body>
</html>
