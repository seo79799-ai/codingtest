<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간편 위치 확인 서비스</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }
        .device-selection {
            margin-bottom: 2rem;
        }
        .device-selection label {
            margin: 0 10px;
            font-size: 1.1rem;
            cursor: pointer;
        }
        #check-location-btn {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 1.5rem 2rem;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
        }
        #check-location-btn:hover {
            background-color: #357ae8;
        }
        .results {
            margin-top: 2rem;
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 1rem;
        }
        .results p {
            font-size: 1.2rem;
            margin: 0.5rem 0;
        }
        .results strong {
            color: #333;
        }
        #loading {
            display: none;
            margin-top: 1rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1단계: 기기 선택 (라디오 버튼) -->
        <div class="device-selection">
            <input type="radio" id="computer" name="device" value="computer" checked>
            <label for="computer">컴퓨터 위치</label>
            <input type="radio" id="phone" name="device" value="phone">
            <label for="phone">휴대폰 위치</label>
        </div>

        <!-- 2단계: 확인 버튼 -->
        <button id="check-location-btn">현재 위치 확인할까요?</button>

        <div id="loading">위치 정보를 가져오는 중...</div>

        <!-- 3단계: 결과 표시 -->
        <div class="results">
            <p><strong>도로명 주소:</strong> <span id="road-address">-</span></p>
            <p><strong>우편번호:</strong> <span id="zip-code">-</span></p>
        </div>
    </div>

    <!-- Google Maps API 로드 (나중에 API 키 필요) -->
    <!-- <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places"></script> -->
    <script>
        /**
         * 1단계: 사용자 권한 요청 및 위치 수집
         * 브라우저의 Geolocation API를 사용하여 현재 위도와 경도를 가져옵니다.
         */
        document.getElementById('check-location-btn').addEventListener('click', () => {
            // 위치 정보 접근 권한 동의 팝업 (브라우저 기본 기능 활용)
            if (!navigator.geolocation) {
                alert("이 브라우저는 위치 정보를 지원하지 않습니다.");
                return;
            }

            const loading = document.getElementById('loading');
            loading.style.display = 'block';

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    // 2단계: 좌표를 주소로 변환 (Reverse Geocoding)
                    reverseGeocode(lat, lng);
                },
                (error) => {
                    loading.style.display = 'none';
                    alert("위치 정보를 가져오는 데 실패했습니다: " + error.message);
                }
            );
        });

        /**
         * 3단계: Google Maps Reverse Geocoding API를 사용하여 주소 변환
         * (참고: 실제 운영 환경에서는 API 키가 필요합니다.)
         */
        async function reverseGeocode(lat, lng) {
            const roadAddressElement = document.getElementById('road-address');
            const zipCodeElement = document.getElementById('zip-code');
            const loading = document.getElementById('loading');
            const deviceType = document.querySelector('input[name="device"]:checked').value;

            try {
                // Google Maps Geocoding API 호출
                // 실제 운영 환경에서는 유효한 API_KEY를 입력해야 합니다.
                const API_KEY = 'YOUR_API_KEY';
                const response = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=${API_KEY}&language=ko`);
                const data = await response.json();

                if (data.status === 'OK' && data.results.length > 0) {
                    const result = data.results[0];
                    let roadAddress = result.formatted_address;
                    let zipCode = '-';

                    // 우편번호(postal_code) 추출
                    for (const component of result.address_components) {
                        if (component.types.includes('postal_code')) {
                            zipCode = component.short_name;
                            break;
                        }
                    }

                    // 기기 선택에 따른 결과 접두어 추가 (사용자 정의 로직)
                    const prefix = deviceType === 'computer' ? '[PC] ' : '[Mobile] ';
                    roadAddressElement.innerText = prefix + roadAddress;
                    zipCodeElement.innerText = zipCode;
                } else {
                    // API 키가 없거나 결과가 없는 경우 대체 텍스트 표시
                    const prefix = deviceType === 'computer' ? '[PC] ' : '[Mobile] ';
                    roadAddressElement.innerText = prefix + "도로명 주소를 찾을 수 없습니다. (API 키 필요)";
                    zipCodeElement.innerText = "-";
                    console.warn('Geocoding API status:', data.status);
                }

            } catch (error) {
                console.error('Error:', error);
                alert("주소 변환 중 오류가 발생했습니다.");
            } finally {
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
