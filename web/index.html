<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위치 정보 확인 서비스</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .device-selection {
            margin-bottom: 20px;
        }
        .main-button {
            padding: 20px 40px;
            font-size: 1.5rem;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .main-button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 30px;
            text-align: left;
            font-size: 1.1rem;
        }
        .result p {
            margin: 5px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1단계: 기기 선택 (라디오 버튼) -->
    <div class="device-selection">
        <label>
            <input type="radio" name="device" value="Computer" checked> 컴퓨터 위치
        </label>
        <label style="margin-left: 20px;">
            <input type="radio" name="device" value="Mobile"> 휴대폰 위치
        </label>
    </div>

    <!-- 2단계: 확인 버튼 -->
    <button class="main-button" onclick="checkLocation()">현재 위치 확인할까요?</button>

    <!-- 3단계: 결과 표시 -->
    <div class="result" id="result-area">
        <p id="address">도로명 주소: </p>
        <p id="zipcode">우편번호: </p>
    </div>
</div>

<script>
    // Google Maps API 키 (실제 사용 시 유효한 키로 교체 필요)
    const API_KEY = 'YOUR_GOOGLE_MAPS_API_KEY';

    async function checkLocation() {
        // 보안: 위치 정보 수집 전 권한 동의 확인 (위치정보법 준수)
        const consent = confirm("위치 정보를 수집하여 주소를 변환하는 데 동의하십니까?");
        if (!consent) {
            alert("위치 정보 수집 동의가 필요합니다.");
            return;
        }

        if (!navigator.geolocation) {
            alert("이 브라우저는 위치 정보를 지원하지 않습니다.");
            return;
        }

        // 위치 수집 시작
        navigator.geolocation.getCurrentPosition(async (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const deviceType = document.querySelector('input[name="device"]:checked').value;

            try {
                // Google Maps Reverse Geocoding API 호출
                const response = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=${API_KEY}&language=ko`);
                const data = await response.json();

                if (data.status === 'OK') {
                    let roadAddress = "정보를 찾을 수 없습니다.";
                    let postcode = "정보를 찾을 수 없습니다.";

                    // 결과에서 도로명 주소와 우편번호 추출
                    // data.results[0]이 가장 상세한 주소를 포함하는 경우가 많음
                    const result = data.results[0];

                    if (result) {
                        roadAddress = `[${deviceType}] ` + result.formatted_address;

                        // 우편번호(postal_code) 찾기
                        const postComponent = result.address_components.find(c => c.types.includes("postal_code"));
                        if (postComponent) {
                            postcode = postComponent.long_name;
                        }
                    }

                    // UI 업데이트
                    document.getElementById('address').innerText = `도로명 주소: ${roadAddress}`;
                    document.getElementById('zipcode').innerText = `우편번호: ${postcode}`;
                } else {
                    alert("주소 변환에 실패했습니다: " + data.status);
                }
            } catch (error) {
                console.error("Error:", error);
                alert("API 호출 중 오류가 발생했습니다.");
            }
        }, (error) => {
            alert("위치 정보를 가져올 수 없습니다: " + error.message);
        });
    }
</script>

</body>
</html>
