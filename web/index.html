<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단순한 위치 정보 확인 서비스</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }
        .selection-group {
            margin-bottom: 2rem;
        }
        .main-button {
            padding: 1rem 2rem;
            font-size: 1.25rem;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 2rem;
        }
        .main-button:hover {
            background-color: #0056b3;
        }
        .result-area {
            text-align: left;
            margin-top: 1rem;
            padding: 1rem;
            border-top: 1px solid #eee;
        }
        .result-item {
            margin: 0.5rem 0;
            font-size: 1rem;
            color: #333;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1단계: 기기 선택 라디오 버튼 -->
        <div class="selection-group">
            <label>
                <input type="radio" name="device" value="Computer" checked> 컴퓨터 위치
            </label>
            <label style="margin-left: 1rem;">
                <input type="radio" name="device" value="Mobile"> 휴대폰 위치
            </label>
        </div>

        <!-- 2단계: 메인 확인 버튼 -->
        <button id="checkLocationBtn" class="main-button">현재 위치 확인할까요?</button>

        <!-- 3단계: 결과 표시 영역 -->
        <div class="result-area">
            <div id="addressResult" class="result-item">도로명 주소: </div>
            <div id="zipResult" class="result-item">우편번호: </div>
        </div>
    </div>

    <script>
        const API_KEY = 'YOUR_GOOGLE_MAPS_API_KEY'; // 여기에 실제 Google Maps API 키를 입력하세요.

        document.getElementById('checkLocationBtn').addEventListener('click', async () => {
            const addressEl = document.getElementById('addressResult');
            const zipEl = document.getElementById('zipResult');
            const deviceType = document.querySelector('input[name="device"]:checked').value;

            // 초기화
            addressEl.innerText = '도로명 주소: 가져오는 중...';
            zipEl.innerText = '우편번호: 가져오는 중...';

            // 1단계: 사용자 권한 요청 및 위치 수집 (navigator.geolocation)
            if (!navigator.geolocation) {
                alert("이 브라우저에서는 위치 정보를 지원하지 않습니다.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    try {
                        // 2단계: Google Maps Reverse Geocoding API 호출
                        const response = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=${API_KEY}&language=ko`);
                        const data = await response.json();

                        if (data.status === 'OK') {
                            const results = data.results;
                            let roadAddress = "정보 없음";
                            let zipCode = "정보 없음";

                            // 결과 데이터에서 도로명 주소와 우편번호 추출
                            // 일반적으로 results[0]이 가장 정확한 주소를 포함함
                            if (results.length > 0) {
                                roadAddress = results[0].formatted_address;

                                // 우편번호(postal_code) 찾기
                                const zipComponent = results[0].address_components.find(comp => comp.types.includes('postal_code'));
                                if (zipComponent) {
                                    zipCode = zipComponent.long_name;
                                }
                            }

                            // 3단계: 화면에 결과 표시 (기기 선택 접두어 포함)
                            addressEl.innerText = `도로명 주소: [${deviceType}] ${roadAddress}`;
                            zipEl.innerText = `우편번호: ${zipCode}`;
                        } else {
                            addressEl.innerText = `도로명 주소: 오류 (${data.status})`;
                            zipEl.innerText = `우편번호: 확인 불가`;
                        }
                    } catch (error) {
                        console.error("Geocoding Error:", error);
                        addressEl.innerText = "도로명 주소: 서버 통신 오류";
                    }
                },
                (error) => {
                    // 권한 거부 또는 오류 발생 시 처리
                    alert("위치 정보 접근 권한이 필요합니다. 설정에서 허용해 주세요.");
                    addressEl.innerText = "도로명 주소: 권한 거부됨";
                    zipEl.innerText = "우편번호: -";
                },
                { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
            );
        });
    </script>
</body>
</html>
