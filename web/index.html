<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위치 정보 확인 서비스</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }
        .radio-group {
            margin-bottom: 20px;
        }
        .check-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
            font-weight: bold;
        }
        .check-btn:hover {
            background-color: #0056b3;
        }
        .result-area {
            margin-top: 20px;
            text-align: left;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .result-item {
            margin-bottom: 10px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>위치 정보 서비스</h2>

    <!-- 1단계: 기기 선택 UI (라디오 버튼) -->
    <div class="radio-group">
        <input type="radio" id="computer" name="device" value="Computer" checked>
        <label for="computer">컴퓨터 위치</label>
        <input type="radio" id="mobile" name="device" value="Mobile">
        <label for="mobile">휴대폰 위치</label>
    </div>

    <!-- 2단계: 위치 확인 버튼 -->
    <button class="check-btn" onclick="getLocation()">현재 위치 확인할까요?</button>

    <!-- 3단계: 결과 표시 영역 -->
    <div class="result-area" id="resultArea">
        <!-- 결과가 여기에 나타납니다 -->
    </div>
</div>

<script>
    const API_KEY = 'YOUR_GOOGLE_MAPS_API_KEY';

    async function getLocation() {
        const resultArea = document.getElementById('resultArea');
        const deviceType = document.querySelector('input[name="device"]:checked').value;

        // 4단계: 위치 정보 접근 권한 요청 및 수집 (위치정보법 준수)
        if (!navigator.geolocation) {
            alert("이 브라우저에서는 위치 정보를 지원하지 않습니다.");
            return;
        }

        resultArea.innerHTML = "위치를 찾는 중입니다...";

        navigator.geolocation.getCurrentPosition(
            async (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                // 5단계: Google Reverse Geocoding API 호출
                try {
                    const response = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=${API_KEY}&language=ko`);
                    const data = await response.json();

                    if (data.status === "OK") {
                        let roadAddress = "정보 없음";
                        let postCode = "정보 없음";

                        // 주소 구성 요소에서 도로명 주소와 우편번호 추출
                        const result = data.results[0];
                        roadAddress = result.formatted_address;

                        const postCodeObj = result.address_components.find(c => c.types.includes("postal_code"));
                        if (postCodeObj) postCode = postCodeObj.long_name;

                        // 6단계: 결과 화면 표시 ([Computer] 또는 [Mobile] 접두사 추가)
                        resultArea.innerHTML = `
                            <div class="result-item"><strong>도로명 주소:</strong> [${deviceType}] ${roadAddress}</div>
                            <div class="result-item"><strong>우편번호:</strong> ${postCode}</div>
                        `;
                    } else {
                        resultArea.innerHTML = "주소를 찾을 수 없습니다. (에러: " + data.status + ")";
                    }
                } catch (error) {
                    resultArea.innerHTML = "API 호출 중 오류가 발생했습니다.";
                    console.error(error);
                }
            },
            (error) => {
                // 권한 거부 또는 오류 처리
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        alert("위치 정보 접근 권한이 거부되었습니다. 주소를 확인하려면 권한을 허용해 주세요.");
                        break;
                    case error.POSITION_UNAVAILABLE:
                        alert("위치 정보를 사용할 수 없습니다.");
                        break;
                    case error.TIMEOUT:
                        alert("위치 정보를 가져오는 시간이 초과되었습니다.");
                        break;
                    default:
                        alert("알 수 없는 오류가 발생했습니다.");
                }
                resultArea.innerHTML = "";
            }
        );
    }
</script>

</body>
</html>
