<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위치 정보 확인 서비스</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .radio-group {
            margin-bottom: 2rem;
        }
        .check-button {
            padding: 1rem 2rem;
            font-size: 1.5rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .check-button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 2rem;
            text-align: left;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1단계: 기기 선택 UI (컴퓨터 또는 휴대폰) -->
    <div class="radio-group">
        <label>
            <input type="radio" name="device" value="컴퓨터" checked> 컴퓨터 위치
        </label>
        <label style="margin-left: 1rem;">
            <input type="radio" name="device" value="휴대폰"> 휴대폰 위치
        </label>
    </div>

    <!-- 2단계: 메인 확인 버튼 -->
    <button class="check-button" onclick="checkLocation()">현재 위치 확인할까요?</button>

    <!-- 3단계: 결과 표시 영역 -->
    <div class="result" id="resultArea">
        <p id="address">도로명 주소: </p>
        <p id="zipcode">우편번호: </p>
    </div>
</div>

<script>
    // Google Maps API Key (실제 사용 시 유효한 키로 교체 필요)
    const API_KEY = 'YOUR_GOOGLE_MAPS_API_KEY';

    async function checkLocation() {
        // 4단계: 위치정보법 준수를 위한 사용자 동의 팝업
        const consent = confirm("사용자의 현재 위치 정보를 수집하시겠습니까? (위치정보법 준수)");
        if (!consent) {
            alert("위치 정보 접근이 거부되었습니다.");
            return;
        }

        // 5단계: 브라우저 Geolocation API를 통한 좌표 수집
        if (!navigator.geolocation) {
            alert("이 브라우저는 위치 정보를 지원하지 않습니다.");
            return;
        }

        navigator.geolocation.getCurrentPosition(async (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const deviceType = document.querySelector('input[name="device"]:checked').value;

            try {
                // 6단계: 구글 Reverse Geocoding API 호출
                // language=ko 파라미터를 추가하여 한국어 주소를 받아옵니다.
                const response = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=${API_KEY}&language=ko`);
                const data = await response.json();

                if (data.status === 'OK') {
                    const result = data.results[0];
                    const formattedAddress = result.formatted_address;

                    // 우편번호(postal_code) 찾기
                    let postalCode = '정보 없음';
                    for (const component of result.address_components) {
                        if (component.types.includes('postal_code')) {
                            postalCode = component.long_name;
                            break;
                        }
                    }

                    // 7단계: 결과 화면 표시 ([기기] 접두사 포함)
                    document.getElementById('address').innerText = `도로명 주소: [${deviceType}] ${formattedAddress}`;
                    document.getElementById('zipcode').innerText = `우편번호: [${deviceType}] ${postalCode}`;
                } else {
                    alert('주소를 변환할 수 없습니다: ' + data.status);
                }
            } catch (error) {
                console.error('API 호출 중 오류 발생:', error);
                alert('위치 정보를 가져오는 중 오류가 발생했습니다.');
            }
        }, (error) => {
            alert('위치 정보를 가져올 수 없습니다: ' + error.message);
        });
    }
</script>

</body>
</html>
