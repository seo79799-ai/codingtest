<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위치 정보 확인 서비스</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .radio-group {
            margin-bottom: 20px;
        }
        .btn-check {
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-check:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            font-size: 1.1rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1단계: 기기 선택 라디오 버튼 (컴퓨터 또는 휴대폰) -->
        <div class="radio-group">
            <label>
                <input type="radio" name="device" value="Computer" checked> 컴퓨터 위치
            </label>
            <label style="margin-left: 20px;">
                <input type="radio" name="device" value="Mobile"> 휴대폰 위치
            </label>
        </div>

        <!-- 2단계: 위치 확인 버튼 -->
        <button class="btn-check" onclick="checkLocation()">현재 위치 확인할까요?</button>

        <!-- 3단계: 결과 표시 영역 -->
        <div class="result" id="result-area">
            <p id="road-address">도로명 주소: </p>
            <p id="zip-code">우편번호: </p>
        </div>
    </div>

    <script>
        // Google Maps API 키 (사용자 환경에 맞게 교체 필요)
        const API_KEY = 'YOUR_GOOGLE_MAPS_API_KEY';

        async function checkLocation() {
            // 4단계: 위치 정보 접근 권한 동의 확인 (위치정보법 준수)
            const confirmAccess = confirm("위치 정보 수집에 동의하십니까? 현재 위치를 기반으로 주소를 조회합니다.");
            if (!confirmAccess) {
                alert("위치 정보 접근을 거부하셨습니다.");
                return;
            }

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    // 기기 선택 값 가져오기
                    const deviceType = document.querySelector('input[name="device"]:checked').value;
                    const prefix = `[${deviceType}] `;

                    try {
                        // 5단계: Google Maps Reverse Geocoding API 호출
                        const response = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=${API_KEY}&language=ko`);
                        const data = await response.json();

                        if (data.status === "OK") {
                            const results = data.results[0];
                            const roadAddress = results.formatted_address;

                            // 우편번호 찾기
                            let zipCode = "정보 없음";
                            for (const component of results.address_components) {
                                if (component.types.includes("postal_code")) {
                                    zipCode = component.long_name;
                                    break;
                                }
                            }

                            // 6단계: 화면에 결과 출력
                            document.getElementById('road-address').innerText = `도로명 주소: ${prefix}${roadAddress}`;
                            document.getElementById('zip-code').innerText = `우편번호: ${prefix}${zipCode}`;
                        } else {
                            alert("주소 변환에 실패했습니다: " + data.status);
                        }
                    } catch (error) {
                        console.error("Error:", error);
                        alert("API 호출 중 오류가 발생했습니다.");
                    }
                }, (error) => {
                    alert("위치 정보를 가져올 수 없습니다: " + error.message);
                });
            } else {
                alert("이 브라우저는 위치 정보를 지원하지 않습니다.");
            }
        }
    </script>
</body>
</html>
