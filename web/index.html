<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위치 정보 확인 서비스</title>
    <style>
        body {
            font-family: 'Malgun Gothic', dotum, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 80%;
            max-width: 500px;
        }
        .device-selection {
            margin-bottom: 2rem;
        }
        .main-button {
            padding: 1.5rem 2rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .main-button:hover {
            background-color: #0056b3;
        }
        .result-area {
            margin-top: 2rem;
            text-align: left;
            font-size: 1.2rem;
            line-height: 1.8;
        }
        .label {
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1단계: 기기 선택 UI (라디오 버튼) -->
    <div class="device-selection">
        <label>
            <input type="radio" name="device" value="Computer" checked> 컴퓨터 위치
        </label>
        <label style="margin-left: 20px;">
            <input type="radio" name="device" value="Mobile"> 휴대폰 위치
        </label>
    </div>

    <!-- 2단계: 메인 확인 버튼 -->
    <button class="main-button" onclick="getLocation()">현재 위치 확인할까요?</button>

    <!-- 3단계: 결과 표시 영역 -->
    <div class="result-area" id="resultArea">
        <p>도로명 주소: <span id="address">-</span></p>
        <p>우편번호: <span id="zipcode">-</span></p>
    </div>
</div>

<script>
    // Google Maps API 로드 후 사용될 상수 (실제 키로 교체 필요)
    const API_KEY = 'YOUR_GOOGLE_MAPS_API_KEY';

    /**
     * 위치 정보를 가져오는 메인 함수
     */
    function getLocation() {
        // 4단계: 위치 정보 수집 전 사용자 동의 확인 (위치정보법 준수)
        if (confirm("정확한 주소 변환을 위해 위치 정보 접근 권한이 필요합니다. 동의하시겠습니까?")) {
            if (navigator.geolocation) {
                // 브라우저 Geolocation API 사용
                navigator.geolocation.getCurrentPosition(showPosition, showError);
            } else {
                alert("이 브라우저는 위치 정보를 지원하지 않습니다.");
            }
        }
    }

    /**
     * 성공적으로 좌표를 가져왔을 때 호출되는 콜백
     */
    async function showPosition(position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;

        // 선택된 기기 확인
        const device = document.querySelector('input[name="device"]:checked').value;
        const prefix = `[${device}] `;

        try {
            // 5단계: Google Maps Reverse Geocoding API 호출
            // language=ko 파라미터를 사용하여 한국어 결과 수신
            const response = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=${API_KEY}&language=ko`);
            const data = await response.json();

            if (data.status === "OK") {
                let roadAddress = "주소를 찾을 수 없습니다.";
                let postalCode = "우편번호 없음";

                // 결과 배열에서 적절한 주소 성분 추출
                if (data.results.length > 0) {
                    roadAddress = prefix + data.results[0].formatted_address;

                    // 우편번호(postal_code) 찾기
                    const postComponent = data.results[0].address_components.find(c => c.types.includes("postal_code"));
                    if (postComponent) {
                        postalCode = postComponent.long_name;
                    }
                }

                // 6단계: 화면에 결과 출력
                document.getElementById('address').innerText = roadAddress;
                document.getElementById('zipcode').innerText = postalCode;
            } else {
                console.error("Geocoding failed:", data.status);
                alert("주소 변환에 실패했습니다. (상태: " + data.status + ")");
            }
        } catch (error) {
            console.error("Error fetching data:", error);
            alert("API 호출 중 오류가 발생했습니다.");
        }
    }

    /**
     * 위치 정보 획득 실패 시 호출되는 콜백
     */
    function showError(error) {
        switch(error.code) {
            case error.PERMISSION_DENIED:
                alert("사용자가 위치 정보 제공을 거부했습니다.");
                break;
            case error.POSITION_UNAVAILABLE:
                alert("위치 정보를 사용할 수 없습니다.");
                break;
            case error.TIMEOUT:
                alert("요청 시간이 초과되었습니다.");
                break;
            case error.UNKNOWN_ERROR:
                alert("알 수 없는 오류가 발생했습니다.");
                break;
        }
    }
</script>

</body>
</html>
