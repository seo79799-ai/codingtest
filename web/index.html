<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단순 위치 정보 확인 서비스</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }
        .device-selector {
            margin-bottom: 2rem;
        }
        .device-selector label {
            margin: 0 10px;
            font-size: 1.1rem;
            cursor: pointer;
        }
        #check-btn {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 1.5rem 2rem;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            width: 100%;
        }
        #check-btn:active {
            transform: scale(0.95);
            background-color: #3367D6;
        }
        .result-area {
            margin-top: 2rem;
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 1rem;
        }
        .result-item {
            font-size: 1.1rem;
            margin: 10px 0;
            color: #333;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1단계: 기기 선택 (라디오 버튼) -->
    <div class="device-selector">
        <label>
            <input type="radio" name="device" value="컴퓨터" checked> 컴퓨터 위치
        </label>
        <label>
            <input type="radio" name="device" value="휴대폰"> 휴대폰 위치
        </label>
    </div>

    <!-- 2단계: 확인 버튼 -->
    <button id="check-btn">현재 위치 확인할까요?</button>

    <!-- 3단계: 결과 표시 영역 -->
    <div class="result-area" id="result-area">
        <div class="result-item" id="address-display">도로명 주소: [대기 중]</div>
        <div class="result-item" id="postcode-display">우편번호: [대기 중]</div>
    </div>
</div>

<!-- Google Maps API 로드 (자신의 API 키로 대체 필요) -->
<!-- window.google이 이미 정의되어 있지 않은 경우에만 스크립트 로드 (테스트 시 mock을 위해) -->
<script>
    if (!window.google) {
        const script = document.createElement('script');
        script.src = "https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&language=ko";
        script.async = true;
        script.defer = true;
        document.head.appendChild(script);
    }
</script>

<script>
    const checkBtn = document.getElementById('check-btn');
    const addressDisplay = document.getElementById('address-display');
    const postcodeDisplay = document.getElementById('postcode-display');

    checkBtn.addEventListener('click', () => {
        // 1단계: 위치 정보 수집 동의 확인 (위치정보법 준수)
        const userAgreed = confirm("정확한 주소 확인을 위해 현재 위치 정보를 수집하시겠습니까?");

        if (!userAgreed) {
            alert("위치 정보 수집에 동의하셔야 서비스 이용이 가능합니다.");
            return;
        }

        // 초기화 및 로딩 표시
        addressDisplay.textContent = "도로명 주소: 위치 찾는 중...";
        postcodeDisplay.textContent = "우편번호: 확인 중...";

        // 2단계: 브라우저 Geolocation API 사용
        if (!navigator.geolocation) {
            addressDisplay.textContent = "오류: 이 브라우저는 위치 정보를 지원하지 않습니다.";
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const deviceType = document.querySelector('input[name="device"]:checked').value;

                // 3단계: Google Maps Reverse Geocoding API를 사용하여 주소 변환
                reverseGeocode(lat, lng, deviceType);
            },
            (error) => {
                let errorMsg = "위치 정보를 가져오지 못했습니다.";
                switch(error.code) {
                    case error.PERMISSION_DENIED: errorMsg = "위치 정보 접근이 거부되었습니다."; break;
                    case error.POSITION_UNAVAILABLE: errorMsg = "위치 정보를 사용할 수 없습니다."; break;
                    case error.TIMEOUT: errorMsg = "요청 시간이 초과되었습니다."; break;
                }
                addressDisplay.textContent = `오류: ${errorMsg}`;
                postcodeDisplay.textContent = "우편번호: -";
            }
        );
    });

    /**
     * 위도, 경도 좌표를 주소로 변환하는 함수
     */
    function reverseGeocode(lat, lng, deviceType) {
        const geocoder = new google.maps.Geocoder();
        const latlng = { lat: parseFloat(lat), lng: parseFloat(lng) };

        geocoder.geocode({ location: latlng }, (results, status) => {
            if (status === "OK") {
                if (results[0]) {
                    // 결과에서 주소와 우편번호 추출
                    const formattedAddress = results[0].formatted_address;
                    let postalCode = "정보 없음";

                    // address_components에서 우편번호(postal_code) 검색
                    for (const component of results[0].address_components) {
                        if (component.types.includes("postal_code")) {
                            postalCode = component.long_name;
                            break;
                        }
                    }

                    // 4단계: 결과 화면 표시
                    addressDisplay.textContent = `도로명 주소: [${deviceType} 위치] ${formattedAddress}`;
                    postcodeDisplay.textContent = `우편번호: ${postalCode}`;
                } else {
                    addressDisplay.textContent = "결과를 찾을 수 없습니다.";
                }
            } else {
                addressDisplay.textContent = "Geocoder 실패: " + status;
            }
        });
    }
</script>

</body>
</html>
